<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imágenes</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.4.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel">
        <div class="image-container" id="imgs">
            <img src="./images/imagen1.PNG" alt="image">
            <img src="./images/imagen2.PNG" alt="image">
            <img src="./images/imagen3.PNG" alt="image">
            <img src="./images/imagen4.PNG" alt="image">
            <img src="./images/imagen5.PNG" alt="image">
            <img src="./images/imagen6.PNG" alt="image">
        </div>
        <div class="buttons-container">
            <button class="btn" id="left">
                <i class="ri-arrow-left-circle-fill"></i>
            </button>
            <button class="btn" id="right">
                <i class="ri-arrow-right-circle-fill"></i>
            </button>
        </div>
    </div>
</body>
<script src="main.js"></script>
</html>
