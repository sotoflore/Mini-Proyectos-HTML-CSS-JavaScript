<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de producto simple</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section>
            <div class="item-top">
                <div class="top-left-logo">
                    <img src="/img/logo.jpg" alt="logo">
                </div>
                <div class="top-right-cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
            </div>
            <div class="main-item">
                <div class="product">
                    <img src="/img/product.png" alt="product">
                </div>
                <h2>Rebook Completo</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.Reprehenderit labore quae quaret eaque</p>
            </div>
            <ul class="valoration">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star-half-stroke"></i>
            </ul>
            <p class="price">$400 USD</p>
            <button class="btn">Adicionar al Carrito</button>
        </section>
    </div>
</body>
</html>
