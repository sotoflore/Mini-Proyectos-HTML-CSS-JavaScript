<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Car</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.4.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-content">
        <div class="content box1">
            <div class="details">
                <div class="description">Descripción</div>
                <p>
                    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Culpa non similique ratione sint alias ea maiores sunt neque vitae quae, sapiente aut minima itaque beatae totam impedit eveniet molestias corporis.
                </p>
                <div class="price-box">
                    <div class="discount">$2000000.00</div>
                    <div class="price">$1000000.00</div>
                </div>
            </div>
            <div class="buton1">
                <button>Comprar<i class="ri-money-dollar-circle-fill"></i></button>
            </div>
        </div>

        <div class="content box2">
            <div class="image-box">
                <div class="image">
                    <img src="./images/car.png" alt="car">
                </div>
                <div class="information">
                    <div class="name">ferrari</div>
                    <div class="buton2">

            </div>

</html>
