<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/icono-aple.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <title>Landing page de Iphone</title>
</head>
<body>
    <header class="hero">
        <div class="logo">
            <img src="./images/icono-aple.png" alt="icono-apple">
        </div>
        <nav class="nav-menu">
            <a href="#" class="menu">Inicio</a>
            <a href="#" class="menu">Acerca de</a>
            <a href="#" class="menu">Productos</a>
            <a href="#" class="menu active">Comprar ahora</a>
        </nav>
    </header>
    <main class="content">
        <video autoplay muted loop id="player">
            <source src="./images/video.mp4" type="video/mp4">
        </video>
        <div class="content-text">
            <h1 class="text1">El télefono <br> más innovador del mercado</h1>
            <p class="text2">El iPhone ofrece un buen rendimiento , una cámara de alta calidad <br> y una experiencia de usuario inigualable.</p>
            <a href="#" class="btn"><i class="bx bxs-cart-download"></i>Comprar ahora</a>
        </div>
        <div class="product">
            <img src="./images/Iphone.png" alt="iphone">
        </div>
    </main>
</body>
</html>
