<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Responsivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="contenedor">
        <header>
            <h1>FORMULARIO RESPONSIVO</h1>
        </header>
        <div id="formulario">
            <form action="" method="post">
                <input type="text" name="nombre" placeholder="Ingrese su nombre">
                <input type="e-mail" name="e-mail" placeholder="Ingrese su e-mail">
                <br>
                <input type="text" name="telefono" placeholder="Ingrese su telefono">
                <input type="text" name="celular" placeholder="Ingese su celular">
                <br>
                <input type="text" name="ciudad" placeholder="Ingrese su ciudad">
                <input type="text" name="pais" placeholder="Ingrese su pais">
                <br>
                <input type="text" name="departamento" placeholder="Ingrese su departamento">
                <input type="url" name="web" placeholder="Ingrese su sitio web">
                <br>
                <textarea rows="10"></textarea>
                <input class="boton-enviar"  type="submit" name="enviar" value="enviar">
            </form>
        </div>
    </div>
</body>
</html>
