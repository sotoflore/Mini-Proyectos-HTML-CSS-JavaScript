<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio de Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="container-card">Inicia Sesión</div>
            <div class="container-icon">
                <div class="circle">
                    <i class="fa-solid fa-hand-point-right"></i>
                </div>
            </div>
            <div class="container-form">
                <form action="#">
                    <label for="email">E-mail</label>
                    <input type="text" id="email" placeholder="Digite su e-mail" autofocus>
                    <div class="container-input">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Digite su contraseña">
                        <i id="view-password" class="fa-sharp fa-solid fa-eye-slash"></i>
                    </div>
                    <div class="change-password">Para cambiar su contraseña haga <a href="javascript:void(0)">click aquí</a></div>
                    <button type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</body>
<script src="main.js"></script>
</html>
